name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Application release whose asset is rebuilt and whose documentation is republished to the website, e.g. tissuumaps@4.0.0-beta.3"
        type: string
        required: true
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  # Opens or updates the "Version Packages" pull request while changesets are
  # pending; publishes the packages, tags the releases and creates the GitHub
  # releases once it is merged
  release:
    if: github.repository == 'TissUUmaps/TissUUmaps' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm and node, and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Create version PR or publish unpublished packages
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: true
  # Builds the application from the release (the one just published if the
  # application was released, or the one given to a manual run), stores it as
  # the release asset, and publishes the release's documentation to the website
  build-site:
    needs: release
    if: ${{ !cancelled() && github.repository == 'TissUUmaps/TissUUmaps' && (inputs.tag != '' || (needs.release.outputs.published == 'true' && contains(fromJSON(needs.release.outputs.published-packages).*.name, 'tissuumaps'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Find the release version
        id: release
        run: |
          version="$(node -p "require('./apps/tissuumaps/package.json').version")"
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "tissuumaps@$version" ]; then
            echo "$INPUT_TAG is not an application release tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - name: Set up pnpm and Node, and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          # The version from devEngines.runtime, or the LTS for releases made
          # before it was declared (which would otherwise get the runner's Node)
          runtime: node
      - name: Build the packages and the application
        run: pnpm run build
      - name: Upload the application release asset
        run: |
          (cd apps/tissuumaps/dist && zip -qr "$GITHUB_WORKSPACE/tissuumaps-$VERSION.zip" .)
          gh release upload "tissuumaps@$VERSION" "tissuumaps-$VERSION.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
      - name: Build API documentation
        run: pnpm run build:apidocs
      - name: Checkout the website
        uses: actions/checkout@v7
        with:
          repository: TissUUmaps/website
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          path: website
      - name: Publish the documentation
        run: |
          node scripts/gha-publish-docs.ts "$VERSION" docs website/releases
          cd website
          git add releases
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: publish TissUUmaps $VERSION"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
          done
          exit 1
        env:
          VERSION: ${{ steps.release.outputs.version }}
