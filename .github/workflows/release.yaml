name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Application release whose site asset is (re)built, e.g. tissuumaps@4.0.0-beta.0; leave empty to only re-assemble and deploy the site"
        type: string
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  # Opens or updates the "Version Packages" pull request while changesets are
  # pending; publishes the packages, tags the releases and creates the GitHub
  # releases once it is merged
  release:
    if: github.repository == 'TissUUmaps/TissUUmaps' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm and node, and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Create version PR or publish unpublished packages
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: true
  # Builds the application and its documentation from the release (the one
  # just published if the application was released, or the one given to a
  # manual run), and stores them as the release assets
  build-site:
    needs: release
    if: ${{ !cancelled() && github.repository == 'TissUUmaps/TissUUmaps' && (inputs.tag != '' || (needs.release.outputs.published == 'true' && contains(fromJSON(needs.release.outputs.published-packages).*.name, 'tissuumaps'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Find the release version
        id: release
        run: |
          version="$(node -p "require('./apps/tissuumaps/package.json').version")"
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "tissuumaps@$version" ]; then
            echo "$INPUT_TAG is not an application release tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "line=$(cut -d. -f1,2 <<< "$version")" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - name: Set up pnpm and Node, and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          # The version from devEngines.runtime, or the LTS for releases made
          # before it was declared (which would otherwise get the runner's Node)
          runtime: node
      - name: Build the packages and the application
        run: pnpm run build
      - name: Build the documentation
        run: pnpm run build:docs
        env:
          DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/${{ steps.release.outputs.line }}/docs/
      - name: Upload the release assets
        run: |
          (cd apps/tissuumaps/dist && zip -qr "$GITHUB_WORKSPACE/tissuumaps-$VERSION.zip" .)
          (cd apps/docs/build && zip -qr "$GITHUB_WORKSPACE/tissuumaps-$VERSION-docs.zip" .)
          gh release upload "tissuumaps@$VERSION" "tissuumaps-$VERSION.zip" "tissuumaps-$VERSION-docs.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
  # Assembles the site from the release assets and deploys it to GitHub Pages;
  # fails while no release has its assets, leaving the deployed site as it is
  deploy-pages:
    needs: [release, build-site]
    if: ${{ !cancelled() && !failure() && github.repository == 'TissUUmaps/TissUUmaps' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          install: false
      - name: Assemble the site from release assets
        run: node scripts/gha-assemble-pages.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mirror the legacy TissUUmaps 3 plugin index
        if: vars.V3_PLUGINS_REPO != ''
        run: |
          mkdir mirror
          gh api "repos/$V3_PLUGINS_REPO/tarball/gh-pages" | tar xz --strip-components=1 -C mirror
          mv mirror/plugins _site/plugins
        env:
          GH_TOKEN: ${{ github.token }}
          V3_PLUGINS_REPO: ${{ vars.V3_PLUGINS_REPO }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
